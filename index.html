function buildProductsHTML(id) {
  const imgs = shopProducts[id] || [];
  if (imgs.length === 0) {
    // Show 5 placeholders
    let html = '';
    for (let i = 0; i < 5; i++) {
      html += `<div class="prod-card"><div class="prod-placeholder">${placeholderSVG}</div></div>`;
    }
    return html;
  }
  // Show up to 5, pad with placeholders
  let html = '';
  for (let i = 0; i < 5; i++) {
    if (i < imgs.length) {
      html += `<div class="prod-card"><img class="prod-img" src="${imgs[i]}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=prod-placeholder>${placeholderSVG.replace(/`/g,"")}</div>'"></div>`;
    } else {
      html += `<div class="prod-card"><div class="prod-placeholder">${placeholderSVG}</div></div>`;
    }
  }
  return html;
}

function buildBuyersHTML(id) {
  const buyers = buyerTop3[id];
  if (!buyers || buyers.length === 0) {
    return `<span class="no-buyer">暂无K播合作记录</span>`;
  }
  return buyers.map(b => `<span class="buyer-tag">${b}</span>`).join('');
}

function buildCard(m) {
  const tc = tagClass[m.tag] || 'tag-da';
  const tl = tagLabel[m.tag] || m.tag;
  const productsHTML = buildProductsHTML(m.id);
  const buyersHTML = buildBuyersHTML(m.id);
  return `
<div class="card" data-tag="${m.tag}">
  <div class="card-top">
    <span class="tag ${tc}">${tl}</span>
    <div class="brand-name">${m.name}</div>
    <div class="intro">${m.intro}</div>
  </div>
  <div class="products-title">🛍 精选货品</div>
  <div class="products-scroll">${productsHTML}</div>
  <div class="buyers-wrap">
    <div class="buyers-title">🤝 近180天K播合作买手</div>
    <div class="buyers-list">${buyersHTML}</div>
  </div>
  <div class="card-btns">
    <a href="${m.shop_url}" target="_blank" class="btn btn-solid">进店选品</a>
    <a href="${m.account_url}" target="_blank" class="btn">账号主页</a>
  </div>
</div>`;
}

const grid = document.getElementById('grid');
merchants.forEach(m => {
  grid.innerHTML += buildCard(m);
});

// Filter
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    document.querySelectorAll('.card').forEach(card => {
      if (f === 'all' || card.dataset.tag === f) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  });
});
</script>
