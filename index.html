*{box-sizing:border-box;margin:0;padding:0}
body{background:#faf8f5;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#2d1b0e}
/* Hero */
.hero{background:linear-gradient(135deg,#3d2314 0%,#6b3a22 60%,#8b5e3c 100%);padding:48px 24px 40px;text-align:center;color:#fff}
.hero h1{font-size:2rem;font-weight:700;letter-spacing:2px;margin-bottom:8px}
.hero p{font-size:1rem;opacity:.85;margin-bottom:28px}
.stats{display:flex;justify-content:center;gap:48px}
.stat{text-align:center}
.stat-num{font-size:2rem;font-weight:700;display:block}
.stat-label{font-size:.8rem;opacity:.7;margin-top:2px}
/* Filter */
.filter-wrap{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e8ddd4;padding:12px 24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.filter-btn{padding:7px 18px;border-radius:20px;border:2px solid #c9b8a8;background:#fff;color:#5c4a3a;font-size:.85rem;cursor:pointer;transition:.2s;font-weight:500}
.filter-btn:hover{border-color:#6b3a22;color:#6b3a22}
.filter-btn.active{background:#6b3a22;border-color:#6b3a22;color:#fff}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1280px;margin:32px auto;padding:0 24px}
@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr;padding:0 16px}}
/* Card */
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07);transition:.25s;border:1px solid #f0e8e0}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.13)}
.card.hidden{display:none}
.card-top{padding:18px 20px 0}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:600;color:#fff;margin-bottom:10px}
.tag-da{background:#5c3d2e}.tag-xin{background:#8b5e3c}.tag-sd{background:#4a6741}.tag-int{background:#2c5282}
.brand-name{font-size:1.25rem;font-weight:700;color:#2d1b0e;margin-bottom:3px}
.shop-name{font-size:.82rem;color:#9e8878;margin-bottom:10px}
.intro{font-size:.84rem;line-height:1.65;color:#5c4a3a;padding-bottom:14px;border-bottom:1px solid #f0e8e0}
/* Products */
.products-title{font-size:.78rem;color:#9e8878;font-weight:600;padding:12px 20px 8px;letter-spacing:1px;text-transform:uppercase}
.products-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 20px 14px;scrollbar-width:thin;scrollbar-color:#d4c4b8 transparent}
.products-scroll::-webkit-scrollbar{height:4px}
.products-scroll::-webkit-scrollbar-thumb{background:#d4c4b8;border-radius:2px}
.prod-card{flex:0 0 130px;background:#faf8f5;border-radius:10px;padding:12px 10px;border:1px solid #ede4da;cursor:default}
.prod-icon{width:44px;height:44px;margin:0 auto 8px;display:block}
.prod-img{width:100%;height:90px;object-fit:cover;border-radius:6px;margin-bottom:8px;background:#f0ebe4}
.prod-cat{font-size:.68rem;color:#8b5e3c;font-weight:600;margin-bottom:4px;text-align:center}
.prod-name{font-size:.78rem;color:#2d1b0e;font-weight:600;margin-bottom:4px;line-height:1.3;text-align:center;min-height:32px}
.prod-price{font-size:.78rem;color:#c0392b;font-weight:700;text-align:center;margin-bottom:3px}
.prod-tip{font-size:.68rem;color:#9e8878;text-align:center;line-height:1.3}
/* Buyers */
.buyers-wrap{padding:0 20px 14px;border-top:1px solid #f0e8e0;margin-top:4px}
.buyers-title{font-size:.78rem;color:#9e8878;font-weight:600;padding:10px 0 6px;letter-spacing:1px}
.buyers-list{display:flex;flex-wrap:wrap;gap:6px}
.buyer-tag{background:#fdf3ec;border:1px solid #e8c9aa;color:#8b5e3c;font-size:.75rem;padding:3px 10px;border-radius:12px;font-weight:500}
.no-buyer{font-size:.78rem;color:#c4b5a8;font-style:italic}
/* Buttons */
.card-btns{display:flex;gap:10px;padding:14px 20px 18px;border-top:1px solid #f0e8e0}
.btn{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:.82rem;font-weight:600;text-decoration:none;transition:.2s;border:2px solid #6b3a22;color:#6b3a22}
.btn:hover{background:#6b3a22;color:#fff}
.btn-solid{background:#6b3a22;color:#fff}.btn-solid:hover{background:#4a2710}
/* Footer */
footer{text-align:center;padding:32px 24px;color:#b0a09a;font-size:.78rem;line-height:1.8;border-top:1px solid #e8ddd4;margin-top:16px}
/* SVG icons */

function bindFilter(){
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.card').forEach(card=>{
        if(f==='all'||card.dataset.tag===f){card.classList.remove('hidden')}
        else{card.classList.add('hidden')}
      });
    });
  });
}

renderCards();
bindFilter();
